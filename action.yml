name: Sync Notion property bindings
description: >-
  Two modes. sync (default): push a repo's bindings.json (Build→Property bindings,
  ids resolved at authoring time) into the MF "Synced Properties" mapping DB —
  deterministic per-build upsert + prune; reads no target databases, so the token
  needs only WRITE on Synced Properties + READ on Builds. verify: a PR gate (no
  token) that fails when a PR changes Notion call-sites but leaves bindings.json
  untouched, so the mapping can't silently drift from the code.

inputs:
  mode:
    description: "sync (default) = reconcile bindings.json into Synced Properties. verify = PR drift gate (needs no token)."
    required: false
    default: sync
  notion-token:
    description: "sync mode: Notion token with WRITE on Synced Properties + READ on Builds. One MF-scoped token serves every integration."
    required: false
  manifest:
    description: >-
      Bindings manifest path. Empty (default) = discover every build manifest in the
      checkout (repo-root + top-level-service-folder bindings.json). A path = sync/verify
      exactly that one file (monorepo escape hatch / local dry-run).
    required: false
    default: ""
  synced-properties-ds:
    description: Data-source id of the Synced Properties DB (override only if it moves).
    required: false
    default: 7d1aeaec-129e-4dde-9040-5761c86aef54
  dry-run:
    description: "sync mode: true = report the diff without writing."
    required: false
    default: "false"
  base-sha:
    description: "verify mode: PR base commit (github.event.pull_request.base.sha)."
    required: false
  head-sha:
    description: "verify mode: PR head commit (github.event.pull_request.head.sha)."
    required: false
  pr-title:
    description: "verify mode: PR title, for the [skip-bindings-check] opt-out."
    required: false
  pr-labels:
    description: "verify mode: newline- or comma-separated PR labels, for the skip-bindings-check opt-out."
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "22"
    - name: Sync bindings
      if: ${{ inputs.mode == 'sync' }}
      shell: bash
      env:
        NOTION_TOKEN: ${{ inputs.notion-token }}
        MANIFEST: ${{ inputs.manifest }}
        SYNCED_PROPERTIES_DS: ${{ inputs.synced-properties-ds }}
        DRY_RUN: ${{ inputs.dry-run }}
      # $GITHUB_ACTION_PATH resolves to this action's dir (auto-fetched by GitHub);
      # the script reads the manifest from the caller's checkout (the cwd).
      run: node "$GITHUB_ACTION_PATH/sync-bindings.mjs"
    - name: Verify bindings (PR gate)
      if: ${{ inputs.mode == 'verify' }}
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_LABELS: ${{ inputs.pr-labels }}
      run: node "$GITHUB_ACTION_PATH/verify-bindings.mjs"
